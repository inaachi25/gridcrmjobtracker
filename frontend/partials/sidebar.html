  <script>
    (function () {
      try {
        var logo = document.querySelector('.sidebar-logo');
        var sidebar = document.querySelector('.sidebar');
        if (!logo || !sidebar) return;
        logo.style.cursor = 'pointer';
        logo.addEventListener('click', function () {
          var collapsed = sidebar.classList.toggle('collapsed');
          try { document.body.classList.toggle('sidebar-collapsed', collapsed); } catch (e) {}
        });

        // Highlight clicked nav item and reflect current page
        var navLinks = sidebar.querySelectorAll('.sidebar-nav .nav-item a');

        function clearActive() {
          sidebar.querySelectorAll('.nav-item').forEach(function (li) {
            li.classList.remove('active');
          });
        }

        function setActiveForHref(href) {
          var matched = false;
          navLinks.forEach(function (link) {
            var linkHref = link.getAttribute('href');
            var li = link.parentElement;
            var isMatch = false;
            try {
              var currentFile = (location.pathname || '').split('/').pop();
              isMatch = (linkHref === currentFile) || (location.href.endsWith(linkHref));
            } catch (e) { isMatch = (linkHref === href); }
            if (isMatch) {
              li.classList.add('active');
              matched = true;
            } else {
              li.classList.remove('active');
            }
          });
          return matched;
        }

        // Set active based on current URL on load
        setActiveForHref();

        // On click, mark the clicked item active (visual) — navigation will still occur
        navLinks.forEach(function (link) {
          link.addEventListener('click', function () {
            clearActive();
            try { link.parentElement.classList.add('active'); } catch (e) {}
          });
        });

      } catch (e) {
        console && console.error && console.error(e);
      }
    })();
  </script>
